name: Reviewed application build implementation
on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      merge_sha:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  authorize:
    if: github.workflow_ref == format('{0}/.github/workflows/reviewed-pr.yml@refs/heads/main', github.repository)
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.review.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Recheck live review and immutable merge before executing PR code
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ inputs.head_sha }}
          PR_BASE: ${{ inputs.base_sha }}
          PR_MERGE: ${{ inputs.merge_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 .github/scripts/review_gate.py verify --pr "$PR_NUMBER"
  tooling:
    needs: authorize
    if: needs.authorize.outputs.ready == 'true'
    name: Review and release tooling tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s .github/scripts/tests -v
      - run: node --test tests/release.test.mjs
      - run: python3 -m unittest discover -s scripts/tests -p 'test_audio*.py' -v
      - uses: dtolnay/rust-toolchain@stable
      - name: Run save acceptance regression suite
        run: python3 -m unittest discover -s scripts/tests -p 'test_save_acceptance.py' -v
      - run: python3 scripts/verify-brand.py
      - run: python3 scripts/audio-deps/test_build.py
  desktop:
    needs: authorize
    if: needs.authorize.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha }}
          persist-credentials: false
      - name: Use a fresh native audio prefix for this run
        shell: bash
        run: echo "OPENTAG_AUDIO_BUILD_ROOT=$RUNNER_TEMP/opentag-audio-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: runner.os == 'Windows'
        with:
          install: make
          update: false
      - name: Bind the installed MSYS2 build tools
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          foreach ($tool in @('usr/bin/bash.exe', 'usr/bin/make.exe')) {
            if (-not (Test-Path (Join-Path $env:MSYS2_LOCATION $tool))) { throw "MSYS2 tool missing: $tool" }
          }
          "OPENTAG_MSYS2=$env:MSYS2_LOCATION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf ffmpeg build-essential cmake make nasm
      - name: macOS media fixtures
        if: runner.os == 'macOS'
        run: brew install ffmpeg cmake nasm
      - name: Windows media fixtures and native assembler
        if: runner.os == 'Windows'
        shell: pwsh
        # Chocolatey's ffmpeg package can transiently fail; retry, then fall back to a pinned build.
        run: |
          $nasmDirectory = Join-Path $env:ProgramFiles 'NASM'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install ffmpeg nasm --no-progress -y
            if ((Get-Command ffmpeg -ErrorAction SilentlyContinue) -and (Test-Path (Join-Path $nasmDirectory 'nasm.exe'))) { break }
            Write-Host "ffmpeg or NASM not installed by Chocolatey (attempt $attempt)"
            Start-Sleep -Seconds (15 * $attempt)
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            # Chocolatey unavailable: fall back to the FFmpeg builds on GitHub.
            $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
            # Pin a month-end build (retained upstream for two years) and fail closed on replacement.
            $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-N-127021-ge0c94b2d1c-win64-gpl.zip'
            $expectedSha256 = '85c4a4636b93d681a07588ffa6f1d8f5c064d9c3fb0622066662906b6fd718a1'
            Invoke-WebRequest $url -OutFile $zip -MaximumRetryCount 5 -RetryIntervalSec 10
            $actualSha256 = (Get-FileHash -LiteralPath $zip -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
            if ($actualSha256 -ne $expectedSha256) { throw "FFmpeg archive SHA-256 mismatch: expected $expectedSha256, got $actualSha256" }
            Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'ffmpeg')
            $bin = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'ffmpeg') -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
            if (-not $bin) { throw 'FFmpeg executable missing from verified archive' }
            Add-Content $env:GITHUB_PATH $bin
            $env:PATH = "$bin;$env:PATH" # this step only; GITHUB_PATH above carries it to later steps
          }
          if (-not (Test-Path (Join-Path $nasmDirectory 'nasm.exe'))) { throw "NASM installation missing (Chocolatey exit code $LASTEXITCODE)" }
          $nasmDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # GitHub's pwsh wrapper ends the step with `exit $LASTEXITCODE`; forget a retried Chocolatey failure once ffmpeg and NASM are verified.
          $global:LASTEXITCODE = 0
      - run: npm ci
      - run: npm run build
      - run: npm run test:ui
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: npm run tauri build
      - name: Check macOS document types (Finder Open With)
        if: runner.os == 'macOS'
        run: |
          product="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).productName")"
          plutil -convert json -o "$RUNNER_TEMP/info.json" "target/release/bundle/macos/$product.app/Contents/Info.plist"
          # shellcheck disable=SC2016
          node -e '
            const types = require(process.argv[1]).CFBundleDocumentTypes || [];
            const ext = types.flatMap(t => t.CFBundleTypeExtensions || []), uti = types.flatMap(t => t.LSItemContentTypes || []);
            for (const x of ["flac", "ogg", "opus", "dsf", "ape", "wv", "m3u8", "cue"]) if (!ext.includes(x)) throw new Error(`.${x} missing`);
            for (const x of ["public.audio", "public.folder"]) if (!uti.includes(x)) throw new Error(`${x} missing`);
            // macOS ignores extensions in an entry that also lists content types.
            if (types.some(t => t.CFBundleTypeExtensions && t.LSItemContentTypes)) throw new Error("mixed document type");
            if (types.some(t => t.LSHandlerRank !== "Alternate")) throw new Error("TagGroove must not claim the default handler");
            console.log(JSON.stringify(types, null, 1));
          ' "$RUNNER_TEMP/info.json"
      - uses: actions/upload-artifact@v4
        with:
          name: TagGroove-${{ matrix.os }}
          path: target/release/bundle/
  native-e2e:
    needs: authorize
    if: needs.authorize.outputs.ready == 'true'
    name: Native UI workflows (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha }}
          persist-credentials: false
      - name: Use a fresh native audio prefix for this run
        shell: bash
        run: echo "OPENTAG_AUDIO_BUILD_ROOT=$RUNNER_TEMP/opentag-audio-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: runner.os == 'Windows'
        with:
          install: make
          update: false
      - name: Bind the installed MSYS2 build tools
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          foreach ($tool in @('usr/bin/bash.exe', 'usr/bin/make.exe')) {
            if (-not (Test-Path (Join-Path $env:MSYS2_LOCATION $tool))) { throw "MSYS2 tool missing: $tool" }
          }
          "OPENTAG_MSYS2=$env:MSYS2_LOCATION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux UI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf ffmpeg xvfb xauth dbus-x11 xdotool imagemagick x11-utils procps build-essential cmake make nasm
      - name: macOS media fixtures
        if: runner.os == 'macOS'
        run: brew install ffmpeg cmake nasm
      - name: Windows media fixtures and native assembler
        if: runner.os == 'Windows'
        shell: pwsh
        # Chocolatey's ffmpeg package can transiently fail; retry, then fall back to a pinned build.
        run: |
          $nasmDirectory = Join-Path $env:ProgramFiles 'NASM'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install ffmpeg nasm --no-progress -y
            if ((Get-Command ffmpeg -ErrorAction SilentlyContinue) -and (Test-Path (Join-Path $nasmDirectory 'nasm.exe'))) { break }
            Write-Host "ffmpeg or NASM not installed by Chocolatey (attempt $attempt)"
            Start-Sleep -Seconds (15 * $attempt)
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            # Chocolatey unavailable: fall back to the FFmpeg builds on GitHub.
            $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
            # Pin a month-end build (retained upstream for two years) and fail closed on replacement.
            $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-N-127021-ge0c94b2d1c-win64-gpl.zip'
            $expectedSha256 = '85c4a4636b93d681a07588ffa6f1d8f5c064d9c3fb0622066662906b6fd718a1'
            Invoke-WebRequest $url -OutFile $zip -MaximumRetryCount 5 -RetryIntervalSec 10
            $actualSha256 = (Get-FileHash -LiteralPath $zip -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
            if ($actualSha256 -ne $expectedSha256) { throw "FFmpeg archive SHA-256 mismatch: expected $expectedSha256, got $actualSha256" }
            Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'ffmpeg')
            $bin = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'ffmpeg') -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
            if (-not $bin) { throw 'FFmpeg executable missing from verified archive' }
            Add-Content $env:GITHUB_PATH $bin
            $env:PATH = "$bin;$env:PATH" # this step only; GITHUB_PATH above carries it to later steps
          }
          if (-not (Test-Path (Join-Path $nasmDirectory 'nasm.exe'))) { throw "NASM installation missing (Chocolatey exit code $LASTEXITCODE)" }
          $nasmDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # GitHub's pwsh wrapper ends the step with `exit $LASTEXITCODE`; forget a retried Chocolatey failure once ffmpeg and NASM are verified.
          $global:LASTEXITCODE = 0
      - name: Keep Git's link.exe from shadowing the MSVC linker in bash
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitLink = Join-Path $env:ProgramFiles 'Git\usr\bin\link.exe'
          if (Test-Path $gitLink) { Remove-Item -LiteralPath $gitLink -Force }
      - run: npm ci
      - name: Build the debug app once
        run: |
          # macOS runs the binary inside the .app bundle; it carries the test identifier.
          if [[ "$RUNNER_OS" == macOS ]]; then bundle=(--bundles app); else bundle=(--no-bundle); fi
          config="$(python scripts/native-test-config.py)"
          npx tauri build --debug "${bundle[@]}" --config "$config"
      - name: Capture user-guide screenshots from the reviewed app
        if: runner.os == 'Linux'
        run: scripts/docs-screenshots.sh docs-screens main-window tag-panel-keep menu-convert tag-to-filename extended-tags
      - name: Upload reviewed guide screenshots
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: docs-screens
          path: docs-screens/
          if-no-files-found: error
      - name: Run native suites
        run: |
          set -o pipefail
          mkdir -p e2e-output
          # Linux has no display: xvfb plus a session bus for single-instance
          # forwarding. macOS and Windows runners have a desktop session.
          if [[ "$RUNNER_OS" == Linux ]]; then run=(dbus-run-session -- xvfb-run -a); else run=(); fi
          status=0
          for suite in core-workflows covers actions options-utils playlists freedb-local gnudb formats-3 general-options remove-mapping list-behaviour rename-fixes keyboard-extended script-export actions-polish sources-3 sources-4 keyboard-ui launch-forwarding export-lists chapters web-sources formats-edge panel-dock chapter-fields library native-fingerprints; do
            fixtures=""
            [[ -x "tests/e2e/$suite-fixtures.sh" ]] && fixtures="$PWD/tests/e2e/$suite-fixtures.sh"
            echo "::group::$suite"
            if ! OPENTAG_E2E_OFFLINE=1 OPENTAG_E2E_FIXTURES="$fixtures" "${run[@]}" scripts/e2e-native.sh "tests/e2e/$suite.js" --no-build 2>&1 | tee "e2e-output/$suite.txt"; then
              echo "::error::Native suite $suite failed on $RUNNER_OS"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-e2e-output-${{ matrix.os }}
          path: e2e-output/
  android:
    needs: authorize
    if: needs.authorize.outputs.ready == 'true'
    name: Android document integration
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha }}
          persist-credentials: false
      - name: Use a fresh native audio prefix for this run
        shell: bash
        run: echo "OPENTAG_AUDIO_BUILD_ROOT=$RUNNER_TEMP/opentag-audio-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native audio build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake make
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: '15859902'
      - name: Install Android build dependencies
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake make
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: npm ci
      - run: npm run test:ui
      - name: Build debug arm64 app without release credentials
        run: |
          # Tauri forwards this alias across the IDE build environment.
          export TAURI_OPENTAG_AUDIO_BUILD_ROOT="$OPENTAG_AUDIO_BUILD_ROOT"
          npm run tauri -- android build --debug --target aarch64 --apk --ci
      - name: Test native viewport, document transport and grant policy
        working-directory: src-tauri/gen/android
        run: ./gradlew :app:testArm64DebugUnitTest :tauri-plugin-document-access:testDebugUnitTest --console=plain
      - name: Retain Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TagGroove-android-document-tests
          path: |
            crates/document-access/android/build/test-results/
            src-tauri/gen/android/app/build/test-results/testArm64DebugUnitTest/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: TagGroove-android-arm64-debug
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error

  docs:
    needs: authorize
    if: needs.authorize.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NO_MKDOCS_2_WARNING: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: hashFiles('mkdocs.yml') != ''
        with:
          python-version: '3.12'
      - name: Install the pinned user-guide toolchain
        if: hashFiles('mkdocs.yml') != ''
        run: python -m pip install -r docs/site-requirements.txt
      - name: Check documentation publication boundaries and rendered content
        if: hashFiles('mkdocs.yml') != ''
        run: python -m unittest discover -s docs/tests -v
      - name: Check the complete user-guide writing plan
        if: hashFiles('mkdocs.yml') != ''
        run: python scripts/docs-status.py
      - name: Build the user guide strictly
        if: hashFiles('mkdocs.yml') != ''
        run: python -m mkdocs build --strict
