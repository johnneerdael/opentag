[package]
name = "tag-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
quick-xml = "=0.42.0"
url = "=2.5.8"
dunce = "1"
lofty = "0.25.1"
serde = { version = "1", features = ["derive"] }
regex = "1"
base64 = "0.22"
walkdir = "2"
tempfile = "3"
chrono = { version = "0.4", features = ["clock", "unstable-locales"] }
num-format = "0.4"
encoding_rs = "0.8"
sys-locale = "0.3"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
regex-compat = { path = "../regex-compat" }
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
