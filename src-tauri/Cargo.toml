[package]
name = "opentag"
version = "0.2.0"
edition = "2021"
license = "MIT"

[lib]
name = "opentag_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "taggroove"
path = "src/main.rs"

[features]
# Profiling builds only: enables the end-to-end script hook (`src/e2e.rs`) in
# release builds. Off by default and never enabled for published releases.
e2e = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-document-access = { path = "../crates/document-access" }
tag-core = { path = "../crates/tag-core" }
opentag-audio-fingerprint = { path = "../crates/audio-fingerprint" }
opentag-library = { path = "../crates/library" }
dunce = "1"
regex-compat = { path = "../crates/regex-compat" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
encoding_rs = "0.8"
# Complete named HTML character references (also used by Tauri’s HTML toolchain).
web_atoms = "0.2.6"
tempfile = "3"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
sha2 = "0.10"
md-5 = "0.10"
crc32fast = "1"
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1.24"
# Tag sources and the update check: rustls with the ring provider and bundled
# roots (no OpenSSL or platform verifier initialisation), so every desktop and
# mobile target builds. `system-proxy` reads the macOS and Windows proxy
# settings (Options → Networking).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
tokio = { version = "1", features = ["sync", "time"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
trash = "5"
# Cover window Copy/Paste cover (image data) and Edit → Copy as Text (WebKit only
# allows navigator.clipboard during a user gesture).
arboard = { version = "3", default-features = false, features = ["image-data"] }
# Dragging a cover from the cover window out to the file manager or desktop.
drag = "2"

# Optional system keychain for the Discogs token (sources/credentials.rs). Linux
# talks to the Secret Service over pure-Rust D-Bus, so no libdbus is needed.
# objc2-app-kit / windows-sys / gdk: modifier keys held during a native file
# drop (File List: Ctrl+drop adds files).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent"] }
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
keyring = { version = "3.6.3", features = ["async-secret-service", "tokio", "crypto-rust"] }
[target.'cfg(target_os = "linux")'.dependencies]
gdk = "0.18"
# Options → General → Notification area: probes for the status-area library
# before creating the icon (it is loaded at run time).
libloading = "0.7"

# Options → General → Notification area (Windows and Linux only).
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
